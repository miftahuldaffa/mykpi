
<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard - Mondelez International</title>
<link rel="icon" href="img/favicon.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/shared.css">
</head>
<body>

<!-- ===== NAVBAR ===== -->
<nav class="nav">
    <div class="nav-brand">
        <div class="nav-logo">M</div>
        <div>
            <div class="nav-title">Leaderboard</div>
            <div class="nav-sub">Mondelez International - 2026</div>
        </div>
    </div>
    <div class="nav-right">
        <a href="index.html" class="nav-link">&#128176; Incentive</a>
        <a href="gs.html" class="nav-link">&#128205; GS</a>
        <a href="leaderboard.html" class="nav-link active">&#127942; Leaderboard</a>
        <button class="theme-btn" onclick="togTheme()">
            <span id="themeIcon">&#127769;</span>
            <span id="themeLabel">Dark</span>
        </button>
        <span class="badge st-load" id="stBadge">
            <span class="dot"></span>
            <span id="stTxt">Loading...</span>
        </span>
    </div>
</nav>

<!-- ===== MAIN CONTENT ===== -->
<div class="wrap">

    <!-- ===== RANKING FILTER BAR ===== -->
    <div class="ctrl-bar">
        <div class="ctrl-bar-title">
            <h3>&#127942; Ranking Salesman</h3>
        </div>
        <div class="ctrl-grid">
            <div class="ctrl-grp">
                <label>Category</label>
                <select id="selSort">
                    <option value="ims">&#128293; IMS Revenue</option>
                    <option value="incentive">&#128176; Incentive (Total)</option>
                    <option value="coverage">&#128200; Coverage %</option>
                    <option value="gc">&#127811; GC %</option>
                    <option value="pf">&#127919; Product Focus (Avg)</option>
                </select>
            </div>
            <div class="ctrl-grp">
                <label>Dari</label>
                <select id="fromMonth">
                    <option value="M01" selected>Januari</option>
                    <option value="M02">Februari</option>
                    <option value="M03">Maret</option>
                    <option value="M04">April</option>
                    <option value="M05">Mei</option>
                    <option value="M06">Juni</option>
                    <option value="M07">Juli</option>
                    <option value="M08">Agustus</option>
                    <option value="M09">September</option>
                    <option value="M10">Oktober</option>
                    <option value="M11">November</option>
                    <option value="M12">Desember</option>
                </select>
            </div>
            <div class="ctrl-grp">
                <label>Sampai</label>
                <select id="toMonth">
                    <option value="M01">Januari</option>
                    <option value="M02">Februari</option>
                    <option value="M03">Maret</option>
                    <option value="M04">April</option>
                    <option value="M05">Mei</option>
                    <option value="M06">Juni</option>
                    <option value="M07">Juli</option>
                    <option value="M08">Agustus</option>
                    <option value="M09" selected>September</option>
                    <option value="M10">Oktober</option>
                    <option value="M11">November</option>
                    <option value="M12">Desember</option>
                </select>
            </div>
            <div class="ctrl-grp">
                <label>Type</label>
                <select id="filterType">
                    <option value="all">Semua Type</option>
                    <option value="whs">WHS</option>
                    <option value="retail">Retail</option>
                    <option value="torist">TO-RIST</option>
                </select>
            </div>
        </div>
    </div>

    <!-- ===== RANKING TABLE SECTION ===== -->
    <div class="section">
        <div class="sec-header">
            <h2>&#127942; Ranking</h2>
            <div class="sub" id="allLabel">Jan - Sep 2026</div>
        </div>
        <div class="sec-body">
            <div id="allRank"></div>
        </div>
    </div>

    <!-- ===== CEK INCENTIVE SECTION ===== -->
    <div class="section">
        <div class="sec-header">
            <h2>&#128176; Cek Incentive</h2>
            <div class="sub" id="zeroLabel">Status incentive salesman</div>
        </div>
        <div class="sec-body">
            <!-- Zero Incentive Filter Bar -->
            <div class="ctrl-grid" style="margin-bottom:14px">
                <div class="ctrl-grp">
                    <label>Dari</label>
                    <select id="zeroFrom">
                        <option value="M01">Januari</option>
                        <option value="M02">Februari</option>
                        <option value="M03">Maret</option>
                        <option value="M04">April</option>
                        <option value="M05">Mei</option>
                        <option value="M06">Juni</option>
                        <option value="M07">Juli</option>
                        <option value="M08">Agustus</option>
                        <option value="M09" selected>September</option>
                        <option value="M10">Oktober</option>
                        <option value="M11">November</option>
                        <option value="M12">Desember</option>
                    </select>
                </div>
                <div class="ctrl-grp">
                    <label>Sampai</label>
                    <select id="zeroTo">
                        <option value="M01">Januari</option>
                        <option value="M02">Februari</option>
                        <option value="M03">Maret</option>
                        <option value="M04">April</option>
                        <option value="M05">Mei</option>
                        <option value="M06">Juni</option>
                        <option value="M07">Juli</option>
                        <option value="M08">Agustus</option>
                        <option value="M09" selected>September</option>
                        <option value="M10">Oktober</option>
                        <option value="M11">November</option>
                        <option value="M12">Desember</option>
                    </select>
                </div>
                <div class="ctrl-grp">
                    <label>Type</label>
                    <select id="zeroType">
                        <option value="all">Semua Type</option>
                        <option value="whs">WHS</option>
                        <option value="retail">Retail</option>
                        <option value="torist">TO-RIST</option>
                    </select>
                </div>
                <div class="ctrl-grp">
                    <label>Status</label>
                    <select id="zeroFilter">
                        <option value="all">Semua</option>
                        <option value="zero">&#128308; Zero Incentive</option>
                        <option value="got">&#128994; Dapat Incentive</option>
                        <option value="hangus">&#128683; Hangus</option>
                    </select>
                </div>
            </div>
            <!-- Summary badges -->
            <div id="zeroSummary"></div>
            <!-- Table -->
            <div id="zeroTable"></div>
        </div>
    </div>

    <!-- ===== TREND CHART SECTION ===== -->
    <div class="section">
        <div class="sec-header">
            <h2>&#128200; Trend Bulanan</h2>
            <div class="sub" id="chartLabel">IMS Revenue</div>
        </div>
        <div class="sec-body">
            <div class="chart-wrap" id="chartWrap"></div>
            <div class="legend" id="chartLegend"></div>
        </div>
    </div>

    <!-- Footer -->
    <div class="ft"><span>Mondelez International</span> &copy; 2026 | KPI Leaderboard</div>
</div>

<!-- ===== SCRIPTS ===== -->
<script src="js/auth.js"></script>
<script src="js/anti-devtools.js"></script>
<script src="js/config.js"></script>
<script src="js/shared.js"></script>
<script src="js/leaderboard.js"></script>

</body>
</html>
