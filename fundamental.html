<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPI Fundamental - Mondelez International</title>
<link rel="icon" href="img/favicon.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/shared.css">
</head>
<body>

<!-- ===== NAVBAR ===== -->
<div class="nav">
    <div class="nav-brand">
        <div class="nav-logo">M</div>
        <div>
            <div class="nav-title">KPI Fundamental Dashboard</div>
            <div class="nav-sub">Mondelez International - 2026</div>
        </div>
    </div>
    <div class="nav-right">
        <a href="#" class="nav-link">&#128176; Incentive</a>
        <a href="#" class="nav-link active">&#128202; Fundamental</a>
        <a href="#" class="nav-link">&#127942; Leaderboard</a>
        <a href="gs.html" class="nav-link active">📍 GS Tracking</a>
        <button class="theme-btn" id="themeBtn">
            <span id="themeIc">&#127769;</span>
            <span id="themeLb">Dark</span>
        </button>
        <span class="badge st-load" id="stBadge">
            <span class="dot"></span>
            <span id="stTxt">Loading...</span>
        </span>
    </div>
</div>

<!-- ===== MAIN CONTENT ===== -->
<div class="wrap">

    <!-- Control Bar: Hari Kerja -->
    <div class="ctrl-bar">
        <h3>&#128197; Hari Kerja</h3>
        <div class="ctrl-grp">
            <label>Actual HK:</label>
            <input type="number" id="actHK" value="0" min="0">
        </div>
        <div class="ctrl-grp">
            <label>Total HK:</label>
            <input type="number" id="totHK" value="0" min="0">
        </div>
        <div class="ctrl-grp">
            <label>Sisa HK:</label>
            <span id="hkDisplay" style="font-weight:700;font-size:.78rem;color:var(--acc)">0 hari</span>
        </div>
        <div class="ctrl-grp">
            <label>&#128336;</label>
            <span id="hkPct" style="font-weight:700;font-size:.78rem;color:var(--acc)">0%</span>
        </div>
    </div>

    <!-- Control Bar: Filter -->
    <div class="ctrl-bar">
        <h3>&#128269; Filter</h3>
        <div class="ctrl-grp">
            <label>Bulan:</label>
            <select id="selMonth">
                <option value="M01">Januari</option>
                <option value="M02">Februari</option>
                <option value="M03">Maret</option>
                <option value="M04">April</option>
                <option value="M05">Mei</option>
                <option value="M06" selected>Juni</option>
                <option value="M07">Juli</option>
                <option value="M08">Agustus</option>
                <option value="M09">September</option>
                <option value="M10">Oktober</option>
                <option value="M11">November</option>
                <option value="M12">Desember</option>
            </select>
        </div>
        <div class="ctrl-grp">
            <label>Tipe:</label>
            <select id="filterType">
                <option value="all">Semua Tipe</option>
                <option value="whs">WHS</option>
                <option value="mt">MT</option> 
                <option value="retail">Retail</option>
                <option value="torist">TO-RIST</option>
            </select>
        </div>
        <div class="ctrl-grp">
            <label>Salesman:</label>
            <select id="filterSales">
                <option value="all">Semua Salesman</option>
            </select>
        </div>
    </div>

    <!-- Summary Cards -->
    <div class="sum-grid" id="sumCards"></div>

    <!-- Salesman Cards Grid -->
    <div class="grid" id="gridCards"></div>

    <!-- Footer -->
    <div class="ft"><span>Mondelez International</span> &copy; 2026 | KPI Fundamental Monitoring</div>
</div>

<!-- ===== SCRIPTS ===== -->
<script src="js/auth.js"></script>
<script src="js/anti-devtools.js"></script>
<script src="js/config.js"></script>
<script src="js/shared.js"></script>
<script src="js/fundamental.js"></script>

</body>
</html>
